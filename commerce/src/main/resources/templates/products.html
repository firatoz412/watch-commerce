<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksiyon | Saat Mağazası</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>

<body class="bg-[#fafafa] text-[#1a1a1a] font-['Jost']">

<header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="/homePage" class="text-2xl font-bold tracking-tight transition-opacity hover:opacity-70">
            SAAT MAĞAZASI
        </a>
        <div class="flex gap-6 items-center text-sm font-medium">
            <a href="/login" class="hover:text-[#f27a1a] transition-colors">Giriş Yap</a>
            <div class="w-px h-4 bg-gray-200"></div>
            <a href="/cart" class="hover:text-[#f27a1a] transition-colors flex items-center gap-2">
                Sepetim
            </a>
        </div>
    </div>
</header>

<nav class="bg-white border-b border-gray-100 overflow-x-auto no-scrollbar py-4">
    <div class="max-w-7xl mx-auto px-6">
        <ul class="flex items-center justify-center space-x-4 list-none p-0 m-0 min-w-max">
            <li>
                <a th:href="@{/products}" 
                   class="brand-link"
                   th:classappend="${activeBrand == null} ? 'brand-active' : ''">
                    Tümü
                </a>
            </li>

            <th:block th:each="brandName : ${ {'rolex','omega','tagheuer','seiko','tissot'} }">
                <li>
                    <a th:href="@{/products(brand=${brandName})}" 
                       class="brand-link"
                       th:text="${#strings.capitalize(brandName)}"
                       th:classappend="${activeBrand == brandName} ? 'brand-active' : ''">
                    </a>
                </li>
            </th:block>
        </ul>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-12">
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        
        <div th:each="product : ${products}" class="product-card relative">
            
            <div class="product-image-wrap aspect-[3/4]">
                
                <button class="btn-favorite" aria-label="Favorilere Ekle">
                    ♥
                </button>

                <img th:if="${product.image != null}" 
                     th:src="@{'/images/watches/' + ${product.image.imageUrl}}" 
                     th:alt="${product.name}"
                     class="transition-transform duration-500 hover:scale-105">
                
                <img th:if="${product.image == null}" 
                     src="/images/watches/default.jpg" 
                     alt="Görsel Yok">

                <a th:href="@{'/product/' + ${product.id}}" class="absolute inset-0 z-10"></a>

            </div>

            <div class="product-info">
                <div>
                    <span class="product-brand"
                          th:text="${#strings.toUpperCase(product.brand)}">
                          marka
                    </span>

                    <h3 class="product-name"
                        th:text="${product.name}">
                        ürün adı
                    </h3>
                </div>
                
                <div class="mt-auto">
                    <p class="product-price"
                       th:text="${product.price != null ? #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT') + ' TL' : '0 TL'}">
                       fiyatı
                    </p>
                </div>
            </div>

            <!-- Sepete ekle -->
            <form th:action="@{/cart/add}" method="post" class="relative z-20">
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit" class="btn-add-to-cart">
                    SEPETE EKLE
                </button>
            </form>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(products)}"
         class="flex flex-col items-center justify-center py-32 text-gray-400">
        <p class="tracking-widest uppercase text-xs">
            Aradığınız kriterlere uygun ürün bulunamadı.
        </p>
    </div>

</main>

</body>
</html>
