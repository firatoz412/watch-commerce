<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksiyon | Saat Mağazası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/Products.css">
</head>
<body>

<header>
    <div class="header-inner">
        <a th:href="@{/}" class="logo">SAAT MAĞAZASI</a>
        <div class="header-actions">
            <a sec:authorize="!isAuthenticated()" href="/login" class="header-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Giriş Yap
            </a>
            <a sec:authorize="isAuthenticated()" th:href="@{/hesabim}" class="header-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Hesabım
            </a>
            <a th:href="${cart != null} ? @{'/cart/' + ${cart.id}} : @{/products}" class="header-btn cart">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                Sepetim
            </a>
        </div>
    </div>
</header>

<nav>
    <div class="nav-inner">
        <ul class="brand-list">
            <li>
                <a th:href="@{/products}"
                   class="brand-link"
                   th:classappend="${activeBrand == null} ? 'brand-active' : ''">
                    Tümü
                </a>
            </li>
            <th:block th:each="brandName : ${ {'rolex','omega','tagheuer','seiko','tissot'} }">
                <li>
                    <a th:href="@{/products(keyword=${brandName})}"
                       class="brand-link"
                       th:text="${#strings.capitalize(brandName)}"
                       th:classappend="${activeBrand == brandName} ? 'brand-active' : ''">
                    </a>
                </li>
            </th:block>
        </ul>
    </div>
</nav>

<main>
    <div class="product-grid">

        <div th:each="product : ${products}" class="product-card">

            <div class="card-image-wrap">
               <a th:href="@{/products(keyword=${product.brand})}" class="card-badge">
                   <span th:text="${#strings.toUpperCase(product.brand)}">MARKA</span>
               </a>

                <button class="btn-fav" aria-label="Favorilere Ekle">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <img th:if="${product.images != null and !product.images.isEmpty()}"
                    th:src="@{'/images/watches/' + ${product.images[0].imageUrl}}"
                    th:alt="${product.name}">

                <img th:if="${product.images == null or product.images.isEmpty()}"
                    src="/images/watches/default.jpg"
                    alt="Görsel Yok">

                <a th:href="@{'/products/' + ${product.id}}" class="card-link-overlay" aria-label="Ürün Detayı"></a>
            </div>

            <div class="card-body">
                <p class="card-name" th:text="${product.name}">Ürün Adı</p>
                <p class="card-price"
                   th:text="${product.price != null ? #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT') + ' TL' : '0 TL'}">
                    0 TL
                </p>
            </div>

            <div class="card-footer">
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="cartId" th:value="${cart != null ? cart.id : ''}">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="hidden" name="quantity" value="1">
                    
                    <button type="submit" class="btn-cart">
                        Sepete Ekle
                    </button>
                </form>

                <a th:href="@{'/products/' + ${product.id}}" class="btn-detail" aria-label="Ürün Detayı">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </a>
            </div>

        </div>
    </div>
    

    <div th:if="${#lists.isEmpty(products)}" class="empty-state">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Aradığınız kriterlere uygun ürün bulunamadı.</p>
    </div>
</main>

<!-- Footer -->
    <footer class="w-full primary-bg text-white">

        <div class="max-w-7xl mx-auto px-4 py-12">

            <div class="grid grid-cols-2 gap-8">

                <div>
                    <h3 class="font-bold mb-4">Kurumsal</h3>
                    <ul class="space-y-2 text-sm">
                        <li><a href="#" class="hover:accent-green hover:underline">Hakkımızda</a></li>
                    </ul>
                </div>

                <div>
                    <h3 class="font-bold mb-4">İletişim</h3>

                    <ul class="space-y-2 text-sm">
                        <li class="flex items-center gap-2">
                            <i data-lucide="phone" class="w-4 h-4"></i>
                            0850 000 00 00
                        </li>

                        <li class="flex items-center gap-2">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                            info@example.com
                        </li>
                    </ul>

                </div>

            </div>

            <div class="border-t border-gray-700 mt-8 pt-8 text-sm">
                <p style="text-align:center;">
                    © 2026 Saat Mağazası. Tüm hakları saklıdır.
                </p>
            </div>

        </div>

    </footer>

</body>
</html>
