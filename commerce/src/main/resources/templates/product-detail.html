<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name + ' | Saat Mağazası'}">Ürün Detayı | Saat Mağazası</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/Product-detail.css">
</head>
<body>

<!-- ── HEADER ── -->
<header>
    <div class="header-inner">
        <a href="/homePage" class="logo">SAAT MAĞAZASI</a>
        <nav class="header-nav">
            <a href="/products" class="nav-link">Koleksiyon</a>
            <a href="/login" class="nav-link">Giriş Yap</a>
            <a href="/cart" class="nav-link cart-btn">
                <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                Sepetim
            </a>
        </nav>
    </div>
</header>

<!-- ── BREADCRUMB ── -->
<div class="breadcrumb">
    <a href="/products">Tüm Saatler</a>
    <span class="sep">/</span>
    <a th:href="@{/products(brand=${product.brand})}"
       th:text="${#strings.capitalize(product.brand)}">Marka</a>
    <span class="sep">/</span>
    <span class="current" th:text="${product.name}">Ürün Adı</span>
</div>

<!-- ── DETAIL LAYOUT ── -->
<div class="detail-layout">

    <!-- IMAGE SIDE -->
    <div class="image-side">
        <div class="main-image-wrap">

            <!-- Brand tag -->
            <span class="image-brand-tag"
                  th:text="${#strings.toUpperCase(product.brand)}">MARKA</span>

            <!-- Fav on image -->
            <button class="btn-fav-img" aria-label="Favorilere Ekle">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>

            <img th:if="${product.image != null}"
                 th:src="@{'/images/watches/' + ${product.image.imageUrl}}"
                 th:alt="${product.name}">
            <img th:if="${product.image == null}"
                 src="/images/watches/default.jpg"
                 alt="Görsel Yok">
        </div>
    </div>

    <!-- INFO SIDE -->
    <div class="info-side">

        <p class="product-brand" th:text="${#strings.toUpperCase(product.brand)}">MARKA</p>
        <h1 class="product-name" th:text="${product.name}">Ürün Adı</h1>

        <!-- Price -->
        <div class="price-block">
            <span class="price-main"
                  th:text="${product.price != null ? #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT') + ' TL' : '0 TL'}">
                0 TL
            </span>
            <span class="price-label">KDV Dahil</span>
        </div>

       <!--Description-->
        <div class="desc-block" th:if="${product.description != null and !#strings.isEmpty(product.description)}">
            <p class="desc-label">Ürün Hakkında</p>
            <p class="desc-text" th:text="${product.description}">Açıklama</p>
        </div> 
      

        <hr class="divider">

        <!-- Action Buttons -->
        <div class="action-stack">

            <!-- Satın Al -->
            <a href="/checkout" class="btn-buy">
                <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                HEMEN SATIN AL
            </a>

            <!-- Sepete Ekle -->
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit" class="btn-cart-add">
                    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    SEPETE EKLE
                </button>
            </form>

            <!-- Favorilere Ekle -->
            <button class="btn-fav-action" type="button">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                FAVORİLERE EKLE
            </button>
        </div>

        <!-- Trust badges -->
        <div class="trust-row">
            <div class="trust-item">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Güvenli Ödeme</span>
            </div>
            <div class="trust-item">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                <span>Ücretsiz Kargo</span>
            </div>
            <div class="trust-item">
                <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span>Kolay İade</span>
            </div>
        </div>

    </div>
</div>

</body>
</html>
