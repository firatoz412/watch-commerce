<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Başarılı | Saat Mağazası</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { text-align: center; padding: 40px; }
        .icon { color: #27ae60; font-size: 60px; margin-bottom: 20px; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .btn { background: #2c3e50; color: white; text-decoration: none; padding: 12px 25px; border-radius: 25px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✔</div>
        <h1>Siparişiniz Alındı!</h1>
        <p>Ödemeniz başarıyla simüle edildi. Siparişiniz hazırlanıyor.</p>
        <a href="/" class="btn">Alışverişe Devam Et</a>
    </div>
</body>
</html>
