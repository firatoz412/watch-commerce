<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş | Saat Mağazası</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

<!-- ── HEADER ── -->
<header>
    <div class="header-inner">
        <a href="/" class="logo">SAAT MAĞAZASI</a>
        <nav class="header-nav">
            <a href="/products" class="nav-link">Koleksiyon</a>
            <a href="/login" class="nav-link">Giriş Yap</a>
            <a href="/register" class="nav-link">Kayıt Ol</a>
        </nav>
    </div>
</header>

<!-- ── PAGE TITLE ── -->
<div class="page-header">
    <h1 class="page-title">Sipariş</h1>
    <p class="page-subtitle">Bilgilerinizi girerek siparişinizi tamamlayın</p>
</div>

<!-- ── LAYOUT ── -->
<div class="order-layout">
    <div class="forms-column">

       <form th:action="@{/payment/process}" th:object="${order}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    
            <div class="form-section">
                <div class="section-label">
                    Teslimat Bilgileri
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Ad</label>
                        <input type="text" th:field="*{firstName}" placeholder="Adınız" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Soyad</label>
                        <input type="text" th:field="*{lastName}" placeholder="Soyadınız" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-posta</label>
                        <input type="email" th:field="*{email}" placeholder="ornek@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Telefon</label>
                        <input type="tel" th:field="*{phone}" placeholder="0(5XX) XXX XX XX" required>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="address">Açık Adres</label>
                    <textarea th:field="*{address}" placeholder="Mahalle, sokak, bina no, daire no..." required></textarea>
                </div>
            </div>

            <div class="form-section">
                <div class="section-label">
                    Ödeme Bilgileri
                </div>
                <div class="form-group">
                    <label for="cardName">Kart Üzerindeki İsim</label>
                    <input type="text" th:field="*{cardHolderName}" placeholder="AD SOYAD" required>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <label for="cardNumber">Kart Numarası</label>
                    <input type="text" th:field="*{cardNumber}" placeholder="XXXX XXXX XXXX XXXX" maxlength="16" required>
                </div>
                <div class="card-input-group" style="margin-top: 16px;">
                    <div class="form-group">
                        <label for="expireMonth">Ay (AA)</label>
                        <input type="text" th:field="*{expireMonth}" placeholder="01" maxlength="2" required>
                    </div>
                    <div class="form-group">
                        <label for="expireYear">Yıl (YY)</label>
                        <input type="text" th:field="*{expireYear}" placeholder="26" maxlength="2" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" th:field="*{cvv}" placeholder="XXX" maxlength="3" required>
                    </div>
                </div>
            </div>

            <button  class="btn-checkout">
                Siparişi Tamamla
            </button>
        </form>

        <!-- Sözleşme -->
        <div class="form-section">
            <div class="checkbox-group" style="margin-top: 0;">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    <a href="/terms">Satış sözleşmesi</a> ve <a href="/privacy">gizlilik politikası</a>'nı okudum, kabul ediyorum.
                </label>
            </div>
        </div>

        <a href="/cart" class="back-link">← Sepete Geri Dön</a>
    </div>

    <!-- ── ORDER SUMMARY ── -->
<div class="summary-box">
    <h3 class="summary-title">Sipariş Özeti</h3>

    <div class="summary-items">

        <div th:each="item : ${cartItems}" class="summary-item">

            <!-- IMAGE -->
            <div class="summary-item-image">

                <img th:if="${item.product.image != null}"
                     th:src="@{'/images/watches/' + ${item.product.image.imageUrl}}"
                     th:alt="${item.product.name}">

                <img th:if="${item.product.image == null}"
                     src="/images/watches/default.jpg"
                     alt="Görsel Yok">

            </div>

            <!-- DETAILS -->
            <div class="summary-item-details">
                <div class="summary-item-brand"
                     th:text="${item.product.brand}">Brand</div>

                <div class="summary-item-name"
                     th:text="${item.product.name}">Product Name</div>

                <div class="summary-item-qty"
                     th:text="'Adet: ' + ${item.quantity}">Adet</div>
            </div>

            <!-- PRICE (backend hesap yoksa güvenli fallback) -->
            <div class="summary-item-price"
                 th:text="${item.product.price * item.quantity} + ' TL'">
                0 TL
            </div>

        </div>

    </div>

    <!-- SHIPPING -->
    <div class="summary-row">
        <span class="summary-row-label">Kargo</span>
        <span class="summary-row-value free">Ücretsiz</span>
    </div>

    <hr class="summary-divider">

    <!-- TOTAL -->
    <div class="summary-total-row">
        <span class="summary-total-label">Toplam</span>
        <span class="summary-total-value"
              th:text="${cartTotal} + ' TL'">0 TL</span>
    </div>


</div>
</div>

</body>
</html>
